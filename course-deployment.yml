apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cloudstudents
  name: deployment-course-vafiya

spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-vafiya

  template:
    metadata:
      labels:
        app: course-vafiya

    spec:
      containers:
        - name: course-service
          image: 991524241826.dkr.ecr.ap-south-2.amazonaws.com/vafiya-course-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001

---
apiVersion: v1
kind: Service
metadata:
  namespace: cloudstudents
  name: service-course-vafiya

spec:
  selector:
    app: course-vafiya
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
  type: NodePort

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: cloudstudents
  name: ingress-course-vafiya
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: student-app
    alb.ingress.kubernetes.io/healthcheck-path: /health

spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /vafiya-student
            pathType: Prefix
            backend:
              service:
                name: service-course-vafiya
                port:
                  number: 3001